name: Check tools

# The tools are hand-written JS in HTML, so a change can break behaviour with no
# build step to catch it. This runs the behaviour checks that exist per tool.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  keycode-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: keycode-logger behaviour checks
        run: node keycode-logger/check.mjs
